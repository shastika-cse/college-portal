<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Faculty Profile - College Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .custom-card { background: #ffffff; border: none; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); padding: 30px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="custom-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold mb-0"><i class="bi bi-pencil-square text-primary me-2"></i> Edit Faculty Profile</h3>
                        <a href="/faculty_profile" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Profile</a>
                    </div>

                    <form method="POST" action="/edit_faculty_profile">
                        <h5 class="text-primary fw-bold mb-3">Basic Details</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Full Name</label>
                                <input type="text" name="full_name" class="form-control" value="{{ faculty.full_name if faculty and faculty.full_name else '' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Employee ID</label>
                                <input type="text" name="employee_id" class="form-control" value="{{ faculty.employee_id if faculty and faculty.employee_id else '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Designation</label>
                                <select name="designation" class="form-select">
                                    <option value="Professor" {% if faculty and faculty.designation == 'Professor' %}selected{% endif %}>Professor</option>
                                    <option value="Associate Professor" {% if faculty and faculty.designation == 'Associate Professor' %}selected{% endif %}>Associate Professor</option>
                                    <option value="Assistant Professor" {% if faculty and faculty.designation == 'Assistant Professor' %}selected{% endif %}>Assistant Professor</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Department</label>
                                <input type="text" name="department" class="form-control" value="{{ faculty.department if faculty and faculty.department else 'B.Tech CSE' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ faculty.email if faculty and faculty.email else '' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Phone Number</label>
                                <input type="text" name="phone" class="form-control" value="{{ faculty.phone if faculty and faculty.phone else '' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Office Room Number</label>
                                <input type="text" name="office_room" class="form-control" value="{{ faculty.office_room if faculty and faculty.office_room else '' }}">
                            </div>
                        </div>

                        <h5 class="text-primary fw-bold mb-3">Academic Details</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Qualification</label>
                                <input type="text" name="qualification" class="form-control" placeholder="e.g. B.E, M.E, Ph.D" value="{{ faculty.qualification if faculty and faculty.qualification else '' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Specialization</label>
                                <input type="text" name="specialization" class="form-control" value="{{ faculty.specialization if faculty and faculty.specialization else '' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Years of Experience</label>
                                <input type="text" name="experience" class="form-control" value="{{ faculty.experience if faculty and faculty.experience else '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Subjects Handling</label>
                                <input type="text" name="subjects_handling" class="form-control" value="{{ faculty.subjects_handling if faculty and faculty.subjects_handling else '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Current Semester Subjects</label>
                                <input type="text" name="current_subjects" class="form-control" value="{{ faculty.current_subjects if faculty and faculty.current_subjects else '' }}">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted small">Research Areas</label>
                                <input type="text" name="research_areas" class="form-control" value="{{ faculty.research_areas if faculty and faculty.research_areas else '' }}">
                            </div>
                        </div>

                        <h5 class="text-primary fw-bold mb-3">About</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <label class="form-label text-muted small">Short Bio / About Faculty</label>
                                <textarea name="bio" class="form-control" rows="3">{{ faculty.bio if faculty and faculty.bio else '' }}</textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted small">Teaching Philosophy</label>
                                <textarea name="philosophy" class="form-control" rows="2">{{ faculty.philosophy if faculty and faculty.philosophy else '' }}</textarea>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary py-2 fw-bold">Save Profile Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
