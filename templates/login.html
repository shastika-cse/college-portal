<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --panel: #ffffff; --text: #14213d; --muted: #64748b; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef5ff 0%, #f8fbff 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%; max-width: 430px;
            background: var(--panel);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
            padding: 2rem;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #dbe4f0;
            padding: 0.75rem 0.9rem;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            border-color: var(--primary);
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 0.75rem;
        }
        .btn-primary:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 54px; height: 54px; font-weight: 700; font-size: 1.1rem;">CP</div>
            <h2 class="fw-bold text-dark fs-3">Welcome to College Portal</h2>
            <p class="text-muted small mb-0">Enter your credentials to access your workspace</p>
        </div>
        {% if error %}
        <div class="alert alert-danger py-2 small mb-3" role="alert">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-medium">Work / Student Email</label>
                <input type="email" name="email" class="form-control" placeholder="e.g. student@college.com" required>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label text-secondary small fw-medium mb-1">Password</label>
                    <a href="#" class="small text-decoration-none" style="color: var(--primary);">Forgot Password?</a>
                </div>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Login to Workspace</button>
        </form>
        <div class="text-center mt-3 pt-3 border-top">
            <p class="small text-muted mb-0">Don’t have an account? <a href="/register" class="text-decoration-none fw-medium" style="color: var(--primary);">Register here</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
