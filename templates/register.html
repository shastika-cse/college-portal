<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - College Portal</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .register-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #dadce0;
            padding: 0.75rem 1rem;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
            border-color: #1a73e8;
        }
        .btn-primary {
            background-color: #1a73e8;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            padding: 0.75rem;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="text-center mb-4">
            <!-- Logo Icon -->
            <div class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 50px; height: 50px; font-weight: bold; font-size: 1.2rem;">CP</div>
            <h2 class="fw-bold text-dark fs-3">Create Workspace Account</h2>
            <p class="text-muted small">Register to get started with College Portal</p>
        </div>

        <form method="POST" action="/register">
    <div class="mb-3">
        <label class="form-label text-secondary small fw-medium">Full Name / Username</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. Shastika" required>
    </div>

    <div class="mb-3">
        <label class="form-label text-secondary small fw-medium">Work / Student Email</label>
        <input type="email" name="email" class="form-control" placeholder="e.g. student@college.com" required>
    </div>

    <div class="mb-3">
        <label class="form-label text-secondary small fw-medium">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <!-- Role Selection First -->
    <div class="mb-3">
        <label class="form-label text-secondary small fw-medium">Select Role</label>
        <select name="role" id="roleSelect" class="form-select" onchange="toggleStudentFields()" required>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
        </select>
    </div>

    <!-- Student Specific Fields (Hidden automatically if Faculty is selected) -->
    <div id="studentFields">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-medium">Register Number</label>
            <input type="text" name="reg_no" class="form-control" placeholder="e.g. 710724...">
        </div>

        <div class="mb-3">
            <label class="form-label text-secondary small fw-medium">Class Name / Department</label>
            <input type="text" name="class_name" class="form-control" placeholder="e.g. B.Tech CSE">
        </div>

        <div class="mb-3">
            <label class="form-label text-secondary small fw-medium">Year & Semester</label>
            <input type="text" name="year" class="form-control" placeholder="e.g. 1st Year - 2nd Semester">
        </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Register Account →</button>
</form>

<!-- JavaScript to show/hide fields based on role -->
<script>
    function toggleStudentFields() {
        const role = document.getElementById('roleSelect').value;
        const studentFields = document.getElementById('studentFields');
        if (role === 'faculty') {
            studentFields.style.display = 'none';
        } else {
            studentFields.style.display = 'block';
        }
    }
</script>

        <div class="text-center mt-3 pt-3 border-top">
            <p class="small text-muted mb-0">Already have an account? <a href="/login" class="text-decoration-none fw-medium" style="color: #1a73e8;">Login here</a></p>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
